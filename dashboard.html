<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotter</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/brand.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .header .subtitle { color: var(--text-muted); font-size: 13px; margin-top: 4px; letter-spacing: 2px; }
        .team-badge { background: var(--surface-1); border: 1px solid var(--border); padding: 10px 18px; border-radius: var(--radius); text-align: right; }
        .team-badge .team-name { color: var(--text-strong); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.14em; }
        .team-badge .team-desc { color: var(--accent); font-size: 11px; font-weight: 600; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.08em; }
        .wolf-pack { display: flex; gap: 8px; margin-top: 6px; justify-content: flex-end; font-size: 12px; color: var(--text-muted); }
        .container { padding: 30px 40px; position: relative; }
        .alert-banner { background: var(--critical-soft); border: 1px solid rgba(255, 77, 79, 0.35); border-left: 4px solid var(--critical); border-radius: var(--radius); padding: 14px 22px; margin-bottom: 24px; position: relative; overflow: hidden; }
        .alert-banner::after { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 50px; background: repeating-linear-gradient(45deg, var(--critical), var(--critical) 5px, transparent 5px, transparent 10px); opacity: 0.15; }
        .alert-banner h3 { color: var(--critical); font-size: 13px; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.12em; }
        .alert-banner p { color: var(--text); font-size: 14px; }
        .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; text-align: left; position: relative; overflow: hidden; }
        .stat-card::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px; background: var(--accent); transition: width 0.3s; }
        .stat-card:hover::after { width: 100%; }
        .stat-card h3 { color: var(--text-muted); font-size: 11px; font-weight: 600; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.1em; }
        .stat-card .value { color: var(--text-strong); font-size: 32px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
        .timeline-section { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 25px; margin-bottom: 25px; }
        .timeline-section h3 { color: var(--text-strong); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .wolf-trail { display: flex; gap: 6px; margin-bottom: 25px; padding: 12px; background: var(--surface-0); border-radius: 4px; overflow-x: auto; }
        .wolf-step { padding: 7px 12px; background: var(--surface-2); border-radius: 4px; font-size: 11px; font-weight: 500; color: var(--text-muted); white-space: nowrap; border-left: 3px solid var(--border-strong); }
        .wolf-step.active { border-left-color: var(--critical); background: var(--critical-soft); color: var(--text-strong); }
        .wolf-step.hunt { border-left-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
        .event { display: flex; gap: 20px; padding: 14px 0; border-bottom: 1px solid var(--border-subtle); }
        .event:last-child { border-bottom: none; }
        .event-time { min-width: 70px; color: var(--accent); font-size: 12px; font-weight: bold; padding-top: 2px; }
        .event-content { flex: 1; }
        .event-title { color: var(--text-strong); font-weight: bold; font-size: 14px; margin-bottom: 4px; }
        .event-tech { display: inline-block; background: var(--accent-soft); color: var(--accent); padding: 2px 6px; border-radius: 3px; font-size: 11px; margin-right: 6px; }
        .event-tactic { display: inline-block; background: var(--surface-2); color: var(--text-muted); padding: 2px 6px; border-radius: 3px; font-size: 10px; }
        .event-desc { color: var(--text-muted); font-size: 12px; line-height: 1.5; margin-top: 4px; }
        .event-impact { color: var(--high); font-size: 11px; margin-top: 4px; font-weight: bold; }
        .wolf-howl { background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px; padding: 20px; }
        .wolf-howl h3 { color: var(--text-strong); margin-bottom: 14px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; }
        .rec-item { display: flex; gap: 15px; padding: 10px 0; border-bottom: 1px solid var(--border-subtle); align-items: center; }
        .rec-item:last-child { border-bottom: none; }
        .rec-num { min-width: 25px; color: var(--accent); font-weight: bold; text-align: center; }
        .rec-text { color: var(--text); }
        .rec-mitre { color: var(--accent); font-size: 11px; margin-left: auto; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px; padding: 18px; }
        .panel h3 { color: var(--text-strong); margin-bottom: 12px; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
        .ioc-list { list-style: none; }
        .ioc-list li { padding: 8px; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; }
        .ioc-ip { color: var(--accent); }
        .ioc-type { background: var(--accent-soft); padding: 2px 5px; border-radius: 2px; font-size: 9px; }
        .howl-box { background: var(--surface-1); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: var(--radius); padding: 18px 22px; margin-bottom: 24px; }
        .howl-box h3 { color: var(--text-strong); font-size: 18px; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 4px; }
        .howl-box p { color: var(--text-muted); font-size: 13px; }
    </style>
</head>
<body>
    <nav class="sidebar" id="app-nav" data-active="dashboard"></nav>
    <script src="/static/brand.js"></script>
    <div class="main-content">
    <div class="header">
        <div>
            <h1 id="operationName"></h1>
            <div class="subtitle" id="operationSubtitle"></div>
        </div>
        <div class="team-badge">
            <div class="team-name" id="teamName"></div>
            <div class="team-desc" id="teamDesc"></div>
            <div class="wolf-pack" id="teamMembers"></div>
        </div>
    </div>

    <div class="container">
        <div class="howl-box">
            <h3 id="dashboardTitle"></h3>
            <p id="operationDesc"></p>
        </div>

        <div class="alert-banner" id="alertBanner" style="display:none;">
            <h3 id="alertTitle"></h3>
            <p id="alertMessage"></p>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><h3 id="statIocLabel">Active IOCs</h3><div class="value" id="statIocValue">0</div></div>
            <div class="stat-card"><h3 id="statUsersLabel">Compromised Users</h3><div class="value" id="statUsersValue" style="color:var(--critical);">0</div></div>
            <div class="stat-card"><h3 id="statSystemsLabel">Affected Systems</h3><div class="value" id="statSystemsValue" style="color:var(--high);">0</div></div>
            <div class="stat-card"><h3 id="statMitreLabel">MITRE Techs</h3><div class="value" id="statMitreValue">0</div></div>
            <div class="stat-card"><h3 id="statStatusLabel">Status</h3><div class="value" id="statStatusValue" style="font-size:14px;color:var(--critical);"></div></div>
        </div>

        <div class="timeline-section">
            <h3 id="killChainTitle"></h3>
            <div class="wolf-trail" id="killChainPhases"></div>
            <div id="timelineContainer"></div>
        </div>

        <div class="grid-2">
            <div class="panel">
                <h3 id="suspiciousIpsTitle"></h3>
                <ul class="ioc-list" id="ipList"></ul>
            </div>
            <div class="panel">
                <h3 id="phishingDomainsTitle"></h3>
                <ul class="ioc-list" id="domainList"></ul>
            </div>
        </div>

        <div class="wolf-howl">
            <h3 id="threatIntelTitle"></h3>
            <div id="threatIntelList"></div>
        </div>

        <div class="wolf-howl" style="margin-top: 25px; border-color: var(--accent);">
            <h3 id="recommendationsTitle"></h3>
            <div id="recommendationsList"></div>
        </div>
    </div>
    </div>
    <script>
        async function loadAll() {
            try {
                const [campaignResp, dataResp, statsResp] = await Promise.all([
                    fetch('/api/campaign?nocache=' + Date.now()),
                    fetch('/api/data?nocache=' + Date.now()),
                    fetch('/api/stats?nocache=' + Date.now())
                ]);
                const campaign = await campaignResp.json();
                const data = await dataResp.json();
                const stats = await statsResp.json();
                renderCampaign(campaign);
                renderStats(stats);
                renderData(data);
            } catch(e) {
                console.log('Error loading:', e);
            }
        }

        function renderCampaign(c) {
            document.title = (c.operation_name ? c.operation_name + ' · ' : '') + 'Spotter';
            document.getElementById('operationName').textContent = c.operation_name || '';
            document.getElementById('operationSubtitle').textContent = c.subtitle || '';
            document.getElementById('teamName').textContent = c.team?.name || '';
            document.getElementById('teamDesc').textContent = c.team?.description || '';
            document.getElementById('teamMembers').innerHTML = (c.team?.members || []).join(' | ');
            document.getElementById('dashboardTitle').textContent = c.dashboard_title || '';
            document.getElementById('operationDesc').textContent = c.description || '';

            if (c.alert_banner && c.alert_banner.title) {
                document.getElementById('alertBanner').style.display = 'block';
                document.getElementById('alertTitle').textContent = c.alert_banner.title;
                document.getElementById('alertMessage').textContent = c.alert_banner.message || '';
            }

            if (c.stats) {
                document.getElementById('statIocLabel').textContent = c.stats.ioc_label || '';
                document.getElementById('statUsersLabel').textContent = c.stats.users_label || '';
                document.getElementById('statSystemsLabel').textContent = c.stats.systems_label || '';
                document.getElementById('statMitreLabel').textContent = c.stats.mitre_label || '';
                document.getElementById('statStatusLabel').textContent = c.stats.status_label || '';
            }

            document.getElementById('killChainTitle').textContent = c.kill_chain_title || '';
            const phasesContainer = document.getElementById('killChainPhases');
            if (c.kill_chain_phases && c.kill_chain_phases.length) {
                phasesContainer.innerHTML = c.kill_chain_phases.map(p =>
                    `<div class="wolf-step ${p.status || ''}">${p.name}</div>`
                ).join('');
            }

            if (c.panels) {
                document.getElementById('suspiciousIpsTitle').textContent = c.panels.suspicious_ips_title || '';
                document.getElementById('phishingDomainsTitle').textContent = c.panels.phishing_domains_title || '';
            }

            document.getElementById('threatIntelTitle').textContent = c.threat_intel_title || '';
            document.getElementById('recommendationsTitle').textContent = c.recommendations_title || '';
        }

        function renderStats(stats) {
            document.getElementById('statIocValue').textContent = stats.active_iocs ?? 0;
            document.getElementById('statUsersValue').textContent = stats.compromised_users ?? 0;
            document.getElementById('statSystemsValue').textContent = stats.affected_systems ?? 0;
            document.getElementById('statMitreValue').textContent = stats.mitre_techniques ?? 0;
            document.getElementById('statStatusValue').textContent = stats.status || '';
        }

        function renderData(data) {
            const timeline = data.timeline || [];
            const ips = data.suspicious_ips || [];
            const domains = data.phishing_domains || [];
            const threatIntel = data.threat_intel || [];
            const recommendations = data.recommendations || [];

            renderTimeline(timeline);
            renderIPs(ips);
            renderDomains(domains);
            renderThreatIntel(threatIntel);
            renderRecommendations(recommendations);
        }

        function renderTimeline(events) {
            const container = document.getElementById('timelineContainer');
            if (!events.length) { container.innerHTML = '<div style="color:var(--text-muted);padding:20px;">No timeline events</div>'; return; }

            const parseDate = (time) => {
                if (!time) return null;
                const m = time.match(/([A-Z]+)\s*(\d+)/i);
                if (m) {
                    const month = m[1].toUpperCase();
                    const shortMonth = month.length > 3 ? month.slice(0,3) : month;
                    return shortMonth + ' ' + parseInt(m[2]);
                }
                return null;
            };

            const grouped = {};
            let lastDate = null;
            events.forEach(e => {
                const time = e.time || '';
                const date = parseDate(time);
                if (date) lastDate = date;
                const group = time === 'TBD' ? 'TBD' : (date || lastDate || 'Other');
                if (!grouped[group]) grouped[group] = [];
                grouped[group].push(e);
            });

            const monthOrder = { 'JAN': 1, 'FEB': 2, 'MAR': 3, 'APR': 4, 'MAY': 5, 'JUN': 6, 'JUL': 7, 'AUG': 8, 'SEP': 9, 'OCT': 10, 'NOV': 11, 'DEC': 12 };
            const dateOrder = (a) => {
                if (a === 'TBD') return -1;
                const m = a.match(/([A-Z]+)\s*(\d+)/i);
                if (m) return -((monthOrder[m[1].toUpperCase()] || 0) * 100 + parseInt(m[2]));
                return 0;
            };

            const sortedDates = Object.keys(grouped).sort((a,b) => dateOrder(a) - dateOrder(b));
            const sortByTime = (a, b) => {
                const ta = a.time || '', tb = b.time || '';
                if (ta === 'TBD' && tb !== 'TBD') return 1;
                if (tb === 'TBD' && ta !== 'TBD') return -1;
                const timeA = ta.match(/(\d+):(\d+)/), timeB = tb.match(/(\d+):(\d+)/);
                if (timeA && timeB) return (parseInt(timeB[1])*60 + parseInt(timeB[2])) - (parseInt(timeA[1])*60 + parseInt(timeA[2]));
                return 0;
            };

            let html = '';
            sortedDates.forEach(date => {
                const dayEvents = grouped[date].sort(sortByTime);
                html += `<div style="margin:25px 0 15px 0;padding-bottom:10px;border-bottom:2px solid var(--accent);font-family:var(--font-sans);font-size:16px;color:var(--accent);">${date}</div>`;
                html += dayEvents.map(e => {
                    const severity = e.severity === 'critical' ? 'var(--critical)' : e.severity === 'high' ? 'var(--high)' : 'var(--medium)';
                    const timeOnly = (e.time || '').replace(/[A-Z]+\s*\d+\s*/i, '').trim() || 'TBD';
                    return `<div class="event">
                        <div class="event-time">${timeOnly}</div>
                        <div class="event-content">
                            <div class="event-title" style="color:${severity};">${e.title || ''}
                                <span class="event-tech">${e.tech || ''}</span>
                                <span class="event-tactic">${e.tactics || ''}</span>
                            </div>
                            <div class="event-desc">${e.desc || ''}</div>
                            <div class="event-impact" style="color:${severity};">${e.impact || ''}</div>
                        </div>
                    </div>`;
                }).join('');
            });
            container.innerHTML = html;
        }

        function renderIPs(ips) {
            const list = document.getElementById('ipList');
            if (!ips.length) { list.innerHTML = '<li style="color:var(--text-muted);">No IPs tracked</li>'; return; }
            list.innerHTML = ips.map(ip => {
                const isActive = ip.status === 'ACTIVE';
                const bg = isActive ? 'var(--critical-soft)' : 'var(--surface-1)';
                const color = isActive ? 'var(--critical)' : 'var(--text-muted)';
                return `<li style="background:${bg};"><span class="ioc-ip" style="color:${color};font-weight:bold;">${ip.ip} ${ip.label ? ' ' + ip.label : ''}</span><span class="ioc-type" style="background:${color};${!isActive?'opacity:0.5':''}">${ip.type}</span></li>`;
            }).join('');
        }

        function renderDomains(domains) {
            const list = document.getElementById('domainList');
            if (!domains.length) { list.innerHTML = '<li style="color:var(--text-muted);">No domains tracked</li>'; return; }
            list.innerHTML = domains.map(d =>
                `<li><span class="ioc-ip" style="color:var(--medium);">${d.domain}</span><span class="ioc-type">${d.type}</span></li>`
            ).join('');
        }

        function renderThreatIntel(items) {
            const container = document.getElementById('threatIntelList');
            if (!items.length) { container.innerHTML = '<div style="color:var(--text-muted);">No threat intel</div>'; return; }
            container.innerHTML = items.map(item =>
                `<div class="rec-item">
                    <div class="rec-num">&#8213;</div>
                    <div class="rec-text">${item.text}</div>
                    <div class="rec-mitre">${item.mitre || ''}</div>
                </div>`
            ).join('');
        }

        function renderRecommendations(items) {
            const container = document.getElementById('recommendationsList');
            if (!items.length) { container.innerHTML = '<div style="color:var(--text-muted);">No recommendations</div>'; return; }
            container.innerHTML = items.map(item => {
                const isActive = item.status === 'active';
                return `<div class="rec-item" style="${!isActive ? 'opacity: 0.6;' : ''}">
                    <div class="rec-num">${isActive ? '&#8213;' : '&#10003;'}</div>
                    <div class="rec-text">${item.text}${!isActive ? ' <strong>(COMPLETED)</strong>' : ''}</div>
                    <div class="rec-mitre">${item.mitre || ''}</div>
                </div>`;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', loadAll);
    </script>
</body>
</html>
