<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotter</title>
    {% include "_head.html" %}
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body class="dash">
    <nav class="sidebar" id="app-nav" data-active="dashboard"></nav>
    <script src="/static/brand.js"></script>

    <div class="main-content">
        <header class="topbar" id="topbar">
            <span class="topbar-op" id="opName"></span>
            <span class="topbar-context" id="opContext"></span>
            <span class="topbar-spacer"></span>
            <span class="topbar-clock mono" id="clock"></span>
            <a class="topbar-link" href="?view=wall" id="wallLink">Wall display</a>
        </header>

        <main class="dash-main" id="dashMain" aria-live="polite">
            <p class="loading">Loading…</p>
        </main>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>

    <script src="/static/js/dashboard.js"></script>
</body>
</html>
